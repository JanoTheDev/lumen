# Windows-only. Build with `npm run build:win` (native sidecar, app bundle, installer, checks).
# appId must equal src/main/app-id.ts (taskbar grouping, notifications, updates).
appId: io.github.janothedev.lumen
productName: Lumen
copyright: Copyright © 2026 JanoTheDev
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - skills/**
  - package.json
  - '!**/*.map'
  - '!resources/tray/generate.mjs'
  # Main loads the CommonJS builds only: drop TS sources, typings, ESM copies and docs.
  - '!node_modules/**/*.{d.ts,d.mts,d.cts,md}'
  - '!node_modules/{openai,@anthropic-ai/sdk,zod}/src/**'
  - '!node_modules/{openai,@anthropic-ai/sdk,@modelcontextprotocol/client}/**/*.mjs'
  - '!node_modules/mammoth/{mammoth.browser*.js,browser/**,test/**,bin/**}'
# UI is English; Chromium's other locale packs are ~45 MB.
electronLanguages:
  - en-US
asar: true
asarUnpack:
  - resources/**
  # Native addon + onnxruntime DLLs cannot load from inside the asar.
  - node_modules/sherpa-onnx-*/**
  # The speech worker loads that addon; keep it on disk beside it.
  - out/main/sherpa-worker*.js
extraResources:
  - from: native/target/release/lumen-native.exe
    to: native/lumen-native.exe
  - from: native/vendor/nvda/x64/nvdaControllerClient.dll
    to: native/nvdaControllerClient.dll
  - from: build/third_party/
    to: third_party/
  # Blender add-on source; Settings → App helpers zips it for "Install from Disk".
  - from: bridges/blender/lumen_bridge/
    to: bridges/blender/lumen_bridge/
    filter: ['**/*', '!__pycache__/**']
  - from: native/vendor/nvda/license.txt
    to: third_party/nvda/license.txt
  - from: native/vendor/nvda/SOURCE.txt
    to: third_party/nvda/SOURCE.txt
  - from: LICENSE
    to: third_party/LICENSE.txt
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  executableName: Lumen
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  # Unsigned builds: updates are checked against the sha512 in latest.yml only.
  verifyUpdateCodeSignature: false
nsis:
  # Per-user, no Admin, no pages. The uninstaller asks about removing settings (installer.nsh).
  oneClick: true
  perMachine: false
  artifactName: Lumen-Setup-${version}.${ext}
  shortcutName: Lumen
  uninstallDisplayName: Lumen
  createDesktopShortcut: false
  createStartMenuShortcut: true
  include: build/installer.nsh
  deleteAppDataOnUninstall: false
portable:
  artifactName: Lumen-${version}-portable.${ext}
# Writes resources/app-update.yml for electron-updater (src/main/update). Builds always run with
# --publish never; .github/workflows/release.yml uploads the files to a draft release on a v* tag.
publish:
  provider: github
  owner: JanoTheDev
  repo: lumen
  releaseType: draft
npmRebuild: false
