[package]
name = "lumen-native"
version = "0.1.0"
edition = "2024"
description = "Lumen OS sidecar: hotkey, input, capture, OCR and UI Automation over stdio"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "lumen-native"
path = "src/main.rs"

[features]
# Builds a manifest with uiAccess="true" (requires a signed binary under Program Files).
uiaccess = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
crossbeam-channel = "0.5"
libloading = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
fast_image_resize = "6"
base64 = "0.22"
jpeg-encoder = { version = "0.7", features = ["simd"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows-future = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_HiDpi",
  "Win32_System_StationsAndDesktops",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics",
  "Graphics_Imaging",
  "Media_Ocr",
  "Media_Core",
  "Media_SpeechSynthesis",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Security_Cryptography",
  "Storage_Streams",
  "Win32_UI_Accessibility",
  "Win32_System_Variant",
  "Win32_System_Ole",
  "Win32_System_Com_StructuredStorage",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Security",
]

[dev-dependencies]
proptest = "1"

[build-dependencies]
embed-resource = "3"

# Image and JPEG code is unusably slow unoptimised; keep dev builds quick to iterate.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Optimised build without fat LTO for local benchmarking and conformance runs.
[profile.fastrel]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
