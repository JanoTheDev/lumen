<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <title>Dwell Ring</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: transparent;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
      }
      #ring {
        position: fixed;
        width: 44px;
        height: 44px;
        transform: translate(-50%, -50%);
        opacity: 0;
        transition: opacity 0.12s ease;
        pointer-events: none;
      }
      #ring.active {
        opacity: 1;
      }
      #ring.flash {
        animation: flash 0.28s ease-out;
      }
      @keyframes flash {
        0% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 1;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.35);
          opacity: 0.8;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.7);
          opacity: 0;
        }
      }
      circle.track {
        stroke: rgba(255, 255, 255, 0.18);
      }
      circle.progress {
        stroke: var(--ai-accent, #7c92ff);
        filter: drop-shadow(0 0 6px color-mix(in srgb, var(--ai-accent, #7c92ff) 60%, transparent));
        transform: rotate(-90deg);
        transform-origin: center;
        transition: stroke-dashoffset 0.05s linear;
      }
      circle.core {
        fill: color-mix(in srgb, var(--ai-accent, #7c92ff) 20%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="ring">
      <svg width="44" height="44" viewBox="0 0 44 44">
        <circle class="track" cx="22" cy="22" r="18" fill="none" stroke-width="3" />
        <circle class="core" cx="22" cy="22" r="4" />
        <circle
          class="progress"
          cx="22"
          cy="22"
          r="18"
          fill="none"
          stroke-width="3"
          stroke-dasharray="113.1"
          stroke-dashoffset="113.1"
          stroke-linecap="round"
        />
      </svg>
    </div>
    <script type="module" src="./src/legacy/dwell.ts"></script>
  </body>
</html>
